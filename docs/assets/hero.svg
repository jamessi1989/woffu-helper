<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Woffu Helper — less time fixing time records</title>
  <desc id="desc">Command-line automation and local MCP tools. An example workday shows 09:00 to 13:00, a 30-minute lunch, and 13:30 to 17:30: eight worked hours.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101d30"/>
      <stop offset="1" stop-color="#182e40"/>
    </linearGradient>
    <linearGradient id="accent" x2="1">
      <stop stop-color="#5de3b5"/>
      <stop offset="1" stop-color="#8bebd2"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="1220" cy="24" r="190" fill="#243d4c" opacity=".45"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="56" y="52" width="194" height="34" rx="17" fill="#263f4d"/>
    <text x="76" y="74" font-size="14" fill="#8bebd2" letter-spacing="1.5">PYTHON · CLI · MCP</text>
    <text x="56" y="151" font-size="49" font-weight="700" fill="#f4f8fb">Woffu Helper</text>
    <text x="56" y="200" font-size="27" fill="#dbe5ed">Less time fixing time records.</text>
    <text x="56" y="252" font-size="18" fill="#a8bdcd">Scheduled signing. Missing-day recovery.</text>
    <text x="56" y="281" font-size="18" fill="#a8bdcd">Tools your AI assistant can actually use.</text>
    <rect x="56" y="323" width="430" height="42" rx="10" fill="url(#accent)"/>
    <text x="77" y="350" font-size="16" font-weight="700" fill="#12332e">YOUR COMPUTER. YOUR WOFFU ACCOUNT.</text>
    <rect x="650" y="53" width="574" height="314" rx="17" fill="#0d1929" stroke="#355164"/>
    <circle cx="675" cy="79" r="5" fill="#5de3b5"/>
    <text x="691" y="85" font-size="14" fill="#adc4d3">EXAMPLE REPAIR PREVIEW</text>
    <path d="M650 105h574" stroke="#2e4557"/>
    <text x="678" y="146" font-size="17" fill="#f4f8fb">Fill an empty workday</text>
    <text x="678" y="185" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#8bebd2">09:00–13:00</text>
    <text x="963" y="185" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#8bebd2">13:30–17:30</text>
    <rect x="678" y="206" width="235" height="14" rx="7" fill="#5de3b5"/>
    <rect x="921" y="206" width="29" height="14" rx="7" fill="#486275"/>
    <rect x="958" y="206" width="235" height="14" rx="7" fill="#5de3b5"/>
    <text x="678" y="254" font-size="16" fill="#cfdae4">8 hours worked</text>
    <text x="992" y="254" font-size="16" fill="#cfdae4">30-minute lunch</text>
    <rect x="678" y="286" width="516" height="49" rx="9" fill="#182d38"/>
    <path d="m696 310 6 6 11-14" fill="none" stroke="#5de3b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="728" y="316" font-size="16" fill="#d6efe7">Inspect → Preview → Apply exact times</text>
  </g>
</svg>
