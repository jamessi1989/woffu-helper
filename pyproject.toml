[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "woffu-helper"
version = "0.3.0"
description = "Woffu CLI and local MCP server: fill missing time records, repair clock-outs, and automate signing"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["requests>=2"]
keywords = ["woffu", "mcp", "time-tracking", "timesheet", "backfill", "clock-in", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Scheduling",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
woffu-autosign = "autosign:cli"
woffu-backfill = "backfill:cli"
woffu-mcp = "woffu_mcp:cli"

[project.urls]
Repository = "https://github.com/jamessi1989/woffu-helper"
Documentation = "https://github.com/jamessi1989/woffu-helper#readme"
Issues = "https://github.com/jamessi1989/woffu-helper/issues"
Changelog = "https://github.com/jamessi1989/woffu-helper/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["autosign", "backfill", "woffu", "woffu_config", "woffu_mcp"]
